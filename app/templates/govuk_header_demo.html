<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOV.UK Header Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "GDS Transport", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            font-size: 16px;
            line-height: 1.25;
            color: #0b0c0c;
            background-color: #ffffff;
        }
        
        .govuk-header {
            font-family: "GDS Transport", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            font-weight: 400;
            font-size: 14px;
            line-height: 1.14286;
            border-bottom: 10px solid #1d70b8;
            background: #0b0c0c;
            color: #ffffff;
        }
        
        .govuk-header__container {
            position: relative;
            padding-top: 10px;
            padding-bottom: 10px;
            border-bottom: 10px solid #1d70b8;
        }
        
        .govuk-header__logotype {
            display: inline-block;
            margin-right: 5px;
        }
        
        .govuk-header__logotype-crown {
            margin-right: 1px;
            fill: currentcolor;
            vertical-align: middle;
        }
        
        .govuk-header__logotype-text {
            font-size: 30px;
            line-height: 1;
            font-weight: bold;
            text-decoration: none;
            color: #ffffff;
        }
        
        .govuk-header__content {
            padding: 20px 15px;
        }
        
        .govuk-header__title {
            font-family: "GDS Transport", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            font-weight: 700;
            font-size: 24px;
            line-height: 1.04167;
            margin: 0;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <header class="govuk-header" role="banner" data-module="govuk-header">
        <div class="govuk-header__container">
            <div class="govuk-header__logotype">
                <svg
                    aria-hidden="true"
                    focusable="false"
                    class="govuk-header__logotype-crown"
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 32 30"
                    height="30"
                    width="32"
                >
                    <path fill="currentColor" fill-rule="evenodd" d="M22.6 10.4c-1 .4-2-.1-2.4-1-.4-.9.1-2 1-2.4.9-.4 2 .1 2.4 1s-.1 2-1 2.4m-5.9 6.7c-.9.4-2-.1-2.4-1-.4-.9.1-2 1-2.4.9-.4 2 .1 2.4 1s-.1 2-1 2.4m10.8-3.7c-1 .4-2-.1-2.4-1-.4-.9.1-2 1-2.4.9-.4 2 .1 2.4 1s0 2-1 2.4m3.3 4.8c-1 .4-2-.1-2.4-1-.4-.9.1-2 1-2.4.9-.4 2 .1 2.4 1s-.1 2-1 2.4M17 4.7l2.3 1.2V2.5l-2.3.7-.2-.2.9-3h-3.4l.9 3-.2.2c-.1.1-2.3-.7-2.3-.7v3.4L15 4.7c.1.1.1.2.2.2l-1.3 4c-.1.2-.1.4-.1.6 0 1.1.8 2 1.9 2.2h.7c1-.2 1.9-1.1 1.9-2.1 0-.2 0-.4-.1-.6l-1.3-4c-.1-.2 0-.2.1-.3m-7.6 5.7c.9.4 2-.1 2.4-1 .4-.9-.1-2-1-2.4-.9-.4-2 .1-2.4 1s0 2 1 2.4m-5 3c.9.4 2-.1 2.4-1 .4-.9-.1-2-1-2.4-.9-.4-2 .1-2.4 1s.1 2 1 2.4m-3.2 4.8c.9.4 2-.1 2.4-1 .4-.9-.1-2-1-2.4-.9-.4-2 .1-2.4 1s0 2 1 2.4m14.8 11c.4 0 .7.3.7.7-.4 1.5-1.6 2.5-3.2 2.5-1.6 0-2.8-1-3.2-2.5 0-.4.3-.7.7-.7h5zm-13.3-1.5c.4 0 .7.3.7.7-.4 1.5-1.6 2.5-3.2 2.5-1.6 0-2.8-1-3.2-2.5 0-.4.3-.7.7-.7h5z"></path>
                </svg>
                <span class="govuk-header__logotype-text">GOV.UK</span>
            </div>
        </div>
        <div class="govuk-header__content">
            <h1 class="govuk-header__title">
                {{ header_text }}
            </h1>
        </div>
    </header>
</body>
</html>
