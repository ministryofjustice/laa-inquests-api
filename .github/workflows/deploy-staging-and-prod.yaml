name: Deploy Main to Staging & Prod

on:
  push:
    tags:
      - "*.*.*"
jobs:
  deploy-staging:
    environment: staging
    runs-on: ubuntu-latest
    permissions:
      id-token: write # This is required for requesting the JWT
      contents: read # This is required for actions/checkout
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Deploy to staging
        uses: ./.github/actions/deploy
        with:
          app-environment: staging
          db-host: ${{ secrets.DB_HOST}}
          db-name: ${{ secrets.DB_NAME }}
          db-password: ${{ secrets.DB_PASSWORD }}
          db-port: ${{ secrets.DB_PORT }}
          db-user: ${{ secrets.DB_USER }}
          ecr-repository: ${{ vars.ECR_REPOSITORY }}
          ecr-region: ${{ vars.ECR_REGION }}
          ecr-registry_url: ${{ secrets.ECR_REGISTRY_URL }}
          ecr-role-to-assume: ${{ secrets.ECR_ROLE_TO_ASSUME }}
          kube-cert: ${{ secrets.KUBE_CERT }}
          kube-token: ${{ secrets.KUBE_TOKEN }}
          kube-cluster: ${{ secrets.KUBE_CLUSTER }}
          kube-namespace: ${{ secrets.KUBE_NAMESPACE }}
          image-tag: ${{ github.sha }}
          ratelimit_max: ${{ vars.RATE_LIMIT_MAX }}
          ratewindow_ms: ${{ vars.RATE_WINDOW_MS }}
          service_name: ${{ vars.SERVICE_NAME }}
          session_name: ${{ vars.SESSION_NAME}}
          session_secret: ${{ secrets.SESSION_SECRET }}
          provider-api-base-url: ${{ vars.PROVIDER_API_BASE_URL }}
          provider-api-key: ${{ secrets.PROVIDER_API_KEY }}
  notify-slack-staging:
    environment: staging
    needs: deploy-staging
    runs-on: ubuntu-latest
    if: always() && github.ref_name == 'main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
      - name: Send Slack Notification
        uses: ./.github/actions/notify
        with:
          app-environment: staging
          slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL_STAGING }}
          pipeline_status: "${{ job.status }} ${{ join(needs.*.result, ' ') }}"

  deploy-production:
    environment: prod
    runs-on: ubuntu-latest
    needs: deploy-staging
    permissions:
      id-token: write # This is required for requesting the JWT
      contents: read # This is required for actions/checkout
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Deploy to production
        uses: ./.github/actions/deploy
        with:
          app-environment: prod
          db-host: ${{ secrets.DB_HOST}}
          db-name: ${{ secrets.DB_NAME }}
          db-password: ${{ secrets.DB_PASSWORD }}
          db-port: ${{ secrets.DB_PORT }}
          db-user: ${{ secrets.DB_USER }}
          ecr-repository: ${{ vars.ECR_REPOSITORY }}
          ecr-region: ${{ vars.ECR_REGION }}
          ecr-registry_url: ${{ secrets.ECR_REGISTRY_URL }}
          ecr-role-to-assume: ${{ secrets.ECR_ROLE_TO_ASSUME }}
          kube-cert: ${{ secrets.KUBE_CERT }}
          kube-token: ${{ secrets.KUBE_TOKEN }}
          kube-cluster: ${{ secrets.KUBE_CLUSTER }}
          kube-namespace: ${{ secrets.KUBE_NAMESPACE }}
          image-tag: ${{ github.sha }}
          ratelimit_max: ${{ vars.RATE_LIMIT_MAX }}
          ratewindow_ms: ${{ vars.RATE_WINDOW_MS }}
          service_name: ${{ vars.SERVICE_NAME }}
          session_name: ${{ vars.SESSION_NAME}}
          session_secret: ${{ secrets.SESSION_SECRET }}
          provider-api-base-url: ${{ vars.PROVIDER_API_BASE_URL }}
          provider-api-key: ${{ secrets.PROVIDER_API_KEY }}
  notify-slack-prod:
    environment: production
    needs: deploy-production
    runs-on: ubuntu-latest
    if: always() && github.ref_name == 'main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
      - name: Send Slack Notification
        uses: ./.github/actions/notify
        with:
          app-environment: production
          slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL_PROD }}
          pipeline_status: "${{ job.status }} ${{ join(needs.*.result, ' ') }}"
