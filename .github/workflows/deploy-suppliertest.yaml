name: Deploy to suppliertest

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Github deployment environment"
        required: false
        default: "suppliertest"
        type: choice
        options:
          - suppliertest

jobs:
  build-ghcr:
    name: Build and Push to GHCR
    permissions:
      contents: read
      packages: write
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/build-ghcr.yaml

  deploy-suppliertest:
    permissions:
      id-token: write # This is required for requesting the JWT
      contents: read # This is required for actions/checkout
    if: ${{ !contains(github.actor, '[bot]') }}
    runs-on: ubuntu-latest
    environment: suppliertest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Deploy to suppliertest
        uses: ./.github/actions/deploy
        with:
          allow-list: ${{ secrets.ALLOW_LIST }}
          app-environment: suppliertest
          db-host: ${{ secrets.DB_HOST}}
          db-name: ${{ secrets.DB_NAME }}
          db-password: ${{ secrets.DB_PASSWORD }}
          db-port: ${{ secrets.DB_PORT }}
          db-user: ${{ secrets.DB_USER }}
          ecr-repository: ${{ vars.ECR_REPOSITORY }}
          ecr-registry_url: ${{ secrets.ECR_REGISTRY_URL }}
          ecr-role-to-assume: ${{ secrets.ECR_ROLE_TO_ASSUME }}
          ecr-region: ${{ vars.ECR_REGION }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-sha: ${{ github.sha }}
          github-ref-name: ${{ github.ref_name }}
          github-head-ref: ${{ github.head_ref }}
          image-tag: ${{ github.sha }}
          kube-cert: ${{ secrets.KUBE_CERT }}
          kube-token: ${{ secrets.KUBE_TOKEN }}
          kube-cluster: ${{ secrets.KUBE_CLUSTER }}
          kube-namespace: ${{ secrets.KUBE_NAMESPACE }}
          provider-api-base-url: ${{ vars.PROVIDER_API_BASE_URL }}
          provider-api-key: ${{ secrets.PROVIDER_API_KEY }}
          service_name: ${{ vars.SERVICE_NAME }}
          session_name: ${{ vars.SESSION_NAME}}
          session_secret: ${{ secrets.SESSION_SECRET }}
  notify-slack:
    permissions:
      contents: read
    environment: suppliertest
    needs: deploy-suppliertest
    runs-on: ubuntu-latest
    if: always() && github.ref_name == 'main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Send Slack Notification
        uses: ./.github/actions/notify
        with:
          app-environment: suppliertest
          slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL_UAT }}
          pipeline_status: "${{ job.status }} ${{ join(needs.*.result, ' ') }}"
