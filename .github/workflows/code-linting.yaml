name: Linting
on:
  workflow_call:
  pull_request:
    types:
      - edited
      - opened
      - reopened
      - synchronize

jobs:
  pip-compile:
    name: Run the pip-compile pre-commit hooks
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
    - name: Checkout the repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'

    - name: Run pip-compile pre-commit
      id: pip_compile
      run: |
        python -m pip install --upgrade pip
        pip install pre-commit
        ls requirements/source/* | xargs pre-commit run pip-compile --files

  lint:
    name: Ruff
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install linting requirements
        run: python -m pip install -r requirements/generated/requirements-linting.txt
      - name: Lint
        run: python -m ruff check --output-format=github
      - name: Format
        run: python -m ruff format --check

