[project]
name = "Inquests API"
requires-python = ">= 3.12"

[tool.ruff]
extend-exclude = ["app/db/migrations/versions"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI relies on function calls (Depends, File, etc.) as argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.File"]

[tool.ruff.lint.per-file-ignores]
# Local dev/seed scripts may log via the root logger.
"bin/*.py" = ["LOG015"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore",
    "default:::app",
]